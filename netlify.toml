# Veteran Drywall — Netlify configuration (v11)
# Static site, no build step. Publish the repo root.
# Pages are generated by tools/build_pages.py (run locally, then commit the HTML).

[build]
  publish = "."

# ---------------------------------------------------------------- redirects
# Old single-page URLs -> new pages (keeps any links/bookmarks working)
[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301
  force = true

[[redirects]]
  from = "/thank-you.html"
  to = "/thank-you/"
  status = 301
  force = true

# Generator source + internal notes are not public
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_notes/*"
  to = "/404.html"
  status = 404
  force = true

# ------------------------------------------------------------------------
# AFTER veteransdrywall.net is registered and added in Netlify → Domain
# management, UNCOMMENT these so the netlify.app copy and www. consolidate
# onto the one canonical domain (important for SEO — no duplicate sites).
# ------------------------------------------------------------------------
# [[redirects]]
#   from = "https://veteransdrywall.netlify.app/*"
#   to = "https://veteransdrywall.net/:splat"
#   status = 301
#   force = true
#
# [[redirects]]
#   from = "https://www.veteransdrywall.net/*"
#   to = "https://veteransdrywall.net/:splat"
#   status = 301
#   force = true

# ---------------------------------------------------------------- headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Versioned CSS/JS (site-v11.*) — safe to cache forever; bump the version on change
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images: long cache (rename a file if you replace it)
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
